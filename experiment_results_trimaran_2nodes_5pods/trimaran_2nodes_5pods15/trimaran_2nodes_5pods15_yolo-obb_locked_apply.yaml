---

# 3. OBB Pod (고부하)
apiVersion: v1
kind: Pod
metadata:
  name: yolo-obb
  labels:
    app: yolo
spec:
  nodeName: gpu-orin2
  restartPolicy: Never
  containers:
    - name: yolo-gpu
      image: ultralytics/ultralytics:latest-jetson-jetpack6
      securityContext: {privileged: true}
      command: ["/bin/bash", "-c"]
      args:
        - |
          cd /mnt/yolo
          python3 -c "from ultralytics import YOLO; model = YOLO('models/yolo11n-obb_640.engine'); model.predict(source='data/dota_src/images', imgsz=640, device=0, save=True, project='runs', name='obb')"
          sleep 3600
      resources: {limits: {nvidia.com/gpu: 1}}
      volumeMounts:
        - name: yolo-shared
          mountPath: /mnt/yolo
  volumes:
    - name: yolo-shared
      persistentVolumeClaim: {claimName: yolo-shared-pvc}


